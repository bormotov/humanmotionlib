name: Release pipeline control

on:
  push:
    branches: [codex/release-pipeline-control]

permissions:
  contents: read

concurrency:
  group: release-pipeline-control-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.wheel.outputs.artifact_name }}
      wheel_name: ${{ steps.wheel.outputs.wheel_name }}
      wheel_sha256: ${{ steps.wheel.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - name: Build and identify wheel
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheel"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          wheel=$(find "$RUNNER_TEMP/wheel" -maxdepth 1 -type f -name '*.whl' -print -quit)
          wheel_name=$(basename "$wheel")
          wheel_sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)
          artifact_name="wheel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$wheel_name" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$wheel_sha256" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ARTIFACT file=$wheel_name sha256=$wheel_sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.wheel.outputs.artifact_name }}
          path: ${{ runner.temp }}/wheel/*
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Install wheel and run tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/received-wheel
      - name: Verify received wheel and install it
        id: install
        env:
          EXPECTED_WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/received-wheel/$EXPECTED_WHEEL_NAME"
          actual_sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)
          test "$actual_sha256" = "$EXPECTED_WHEEL_SHA256"
          printf '%s\n' "ARTIFACT received file=$EXPECTED_WHEEL_NAME sha256=$actual_sha256"
          uv venv "$RUNNER_TEMP/test-env"
          uv pip install --python "$RUNNER_TEMP/test-env/bin/python" "$wheel"
          echo "TEST_PYTHON=$RUNNER_TEMP/test-env/bin/python" >> "$GITHUB_ENV"
      - name: Run host-only test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          HUMANMOTIONLIB_SOURCE_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u PYTHONHOME "$TEST_PYTHON" - <<'PY'
          import os
          import sys
          from pathlib import Path
          import humanmotionlib.check_host as check_host

          root = Path(os.environ["HUMANMOTIONLIB_SOURCE_ROOT"])
          suite, exclusions, errors = check_host.discover_host_tests(root)
          raise SystemExit(check_host.run_selected_tests(suite, exclusions, errors, sys.stderr))
          PY
      - name: Run character installation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          HUMANMOTIONLIB_SOURCE_ROOT: ${{ github.workspace }}
          HML_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
          HML_ACCEPTANCE_REPOSITORY: ${{ github.workspace }}
          HML_ACCEPTANCE_ROOT: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/characters"
          printf 'not-a-real-character: true\n' > "$RUNNER_TEMP/characters/poison.yaml"
          cp "$HUMANMOTIONLIB_SOURCE_ROOT/pyproject.toml" "$RUNNER_TEMP/pyproject.toml"
          env -u PYTHONPATH -u PYTHONHOME "$TEST_PYTHON" -c \
            'import sys, unittest; sys.path.insert(0, sys.argv[1]); suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_character_installation"); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())' \
            "$HUMANMOTIONLIB_SOURCE_ROOT"

  publish-artifact:
    name: Publish tested wheel as Actions artifact
    needs: [build, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: received-wheel
      - name: Verify wheel identity
        env:
          EXPECTED_WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="received-wheel/$EXPECTED_WHEEL_NAME"
          actual_sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)
          test "$actual_sha256" = "$EXPECTED_WHEEL_SHA256"
          printf '%s\n' "ARTIFACT publishing file=$EXPECTED_WHEEL_NAME sha256=$actual_sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-${{ needs.build.outputs.wheel_name }}-${{ github.run_id }}
          path: received-wheel/${{ needs.build.outputs.wheel_name }}
          if-no-files-found: error
          retention-days: 7
