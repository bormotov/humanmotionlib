name: Release pipeline control (mock checks)

on:
  push:
    branches: [codex/release-pipeline-control]

permissions:
  contents: read

concurrency:
  group: release-pipeline-control-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      wheel_name: ${{ steps.identity.outputs.wheel_name }}
      wheel_sha256: ${{ steps.identity.outputs.wheel_sha256 }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false

      - name: Build distributions and report wheel identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv lock --check
          uv build --wheel --sdist --out-dir "$RUNNER_TEMP/distributions"
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/distributions/*.whl)
          sdists=("$RUNNER_TEMP"/distributions/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          wheel_name=$(basename "${wheels[0]}")
          wheel_sha256=$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)
          artifact_name="release-control-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$wheel_name" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$wheel_sha256" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ARTIFACT file=$wheel_name sha256=$wheel_sha256"
          printf '%s  %s\n' "$wheel_sha256" "$wheel_name" > "$RUNNER_TEMP/distributions/wheel.sha256"

      - name: Upload built package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/distributions/*
          if-no-files-found: error
          retention-days: 7

  mock-checks:
    name: Receive wheel (tests intentionally stubbed)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download the built package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: received-package

      - name: Report received wheel and simulate test success
        env:
          EXPECTED_WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(received-package/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel_name=$(basename "${wheels[0]}")
          wheel_sha256=$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)
          test "$wheel_name" = "$EXPECTED_WHEEL_NAME"
          test "$wheel_sha256" = "$EXPECTED_WHEEL_SHA256"
          printf '%s\n' "ARTIFACT received file=$wheel_name sha256=$wheel_sha256"
          echo "Mock checks: success (no tests were executed)." >> "$GITHUB_STEP_SUMMARY"

  publish-artifact:
    name: Publish verified package as an Actions artifact
    needs: [build, mock-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the built package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: publish-package

      - name: Confirm wheel identity before artifact publication
        env:
          EXPECTED_WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(publish-package/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel_name=$(basename "${wheels[0]}")
          wheel_sha256=$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)
          test "$wheel_name" = "$EXPECTED_WHEEL_NAME"
          test "$wheel_sha256" = "$EXPECTED_WHEEL_SHA256"
          printf '%s\n' "ARTIFACT publishing file=$wheel_name sha256=$wheel_sha256"

      - name: Publish package artifact (no GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-${{ needs.build.outputs.wheel_name }}-${{ github.run_id }}
          path: publish-package/*
          if-no-files-found: error
          retention-days: 7
