losses:
- 'Many-to-one spinal mapping: L1, T6, T1, and C3 proxies do not retain every vertebral action.'
- Knee rollback and moving joint-center translations are internal; VRMA permits animated translation only
  on hips, so survival is not assumed.
- Radioulnar separation and moving radiocarpal midpoint require internal radius/ulna frames; the hand
  proxy does not encode them independently.
- Scapulae, patellae, ribs, and cartilage guides are internal, not public humanoid helper bones.
- Optional eyes, jaw, and individual finger channels are unavailable or fixed/grouped as documented.
- MPFB and Rigify are not used; no mapping to uninspected backend bones is asserted.
- FK baking, distribution export, and reconstruction/error round trips belong to a later change and have
  not been performed.
