# SPDX-License-Identifier: CC-BY-4.0
schema_version: 1
kind: skeleton-profile
id: adult-reference-v1
description: Symmetric scaled adult reference skeleton; authored anatomical approximations with four W
  mechanical limb ratios; no muscles or measured individual anatomy.
license: CC-BY-4.0
provenance:
  kind: adapted
  license: CC-BY-4.0
  sources:
  - material: hands-on-anatomy-2024
    locator: Authored skeletal/action text, chapters 1–9; no figures
  - material: wang-2024-segment-lengths
    locator: Adult DXA rows, Table 1; mechanical-axis definitions
  rationale: Numeric dossier in anatomical-human-skeleton/design.md; H anatomy text and W ratios.
  changes: Authored procedural approximation; nominal coordinate/shape tolerance 1e-4 H, rigid dimensions
    1e-6 H. Only the four named mechanical segment ratios use symmetric W measurements. Expanded left-side
    records use the canonical mirror, including proper face winding and joint-frame reflection; primitive
    dimensions are unchanged.
units: m
stature_m: 1.7
space:
  handedness: right
  right: +X
  anterior: +Y
  superior: +Z
  floor_z_m: 0
  quaternion_order: wxyz
  composition: q_local=q_rest*q_delta;q_world=q_parent*q_local
proportions:
  upper_arm: 0.1605
  forearm: 0.1365
  thigh: 0.234
  shank: 0.2155
