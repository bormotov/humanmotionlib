schema_version: 1
kind: skeleton-diagnostic
format: skeleton-diagnostic/v1
profile: adult-reference-v1
license: CC-BY-4.0
provenance:
  kind: authored
  license: CC-BY-4.0
  sources: []
  rationale: Project-authored diagnostic/reference scene from the approved numerical dossier; no external
    motion or asset.
  changes: Original verification intent; not measured gait or clinical validation.
duration_beats: 4
controls:
- arm_L
- arm_R
rest_policy:
  policy: base
  base_fixture: neutral
tracks:
- channel: shoulder.R.plane
  easing: ease_in_out
  keys:
  - beat: 0
    value: 0
  - beat: 1
    value: -180
  - beat: 3
    value: 180
  - beat: 4
    value: 0
- channel: shoulder.R.elevation
  easing: linear
  keys:
  - beat: 0
    value: 1
- channel: shoulder.L.plane
  easing: ease_in_out
  keys:
  - beat: 0
    value: 0
  - beat: 1
    value: -180
  - beat: 3
    value: 180
  - beat: 4
    value: 0
- channel: shoulder.L.elevation
  easing: linear
  keys:
  - beat: 0
    value: 1
world_root:
  mode: clearance_stage
  translation_m:
  - 0
  - 0
  - 0.255
  orientation:
  - 1
  - 0
  - 0
  - 0
  clearance_h: 0.15
contacts: []
terminal_contacts:
- foot: L
  state: none
- foot: R
  state: none
procedural:
  noise: false
  follow_through: false
id: sweep-shoulder-bilateral-plane
description: Floating isolated shoulder.bilateral.plane action sweep through its neutral, lower and upper
  operating values; not a functional exercise. Plane is observed in an explicitly authored 1-degree elevation
  context; the swept action starts at its neutral value. Plane is observed in an explicitly authored 1-degree
  elevation context; the swept action starts at its neutral value. The explicit mid-sweep via at beat
  2 is plane zero; azimuth interpolation is unwrapped scalar interpolation.
construction:
  type: action_sweep
  side: bilateral
  start_beat: 0
  end_beat: 4
  reference_knots:
  - beat: 2
    value: 0
