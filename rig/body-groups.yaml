# SPDX-License-Identifier: CC-BY-4.0
schema_version: 1
kind: body-groups
id: adult-reference-v1-groups
description: Smallest-group membership for action intent and generated frame transforms; shoulder helpers
  are arm-owned.
license: CC-BY-4.0
provenance:
  kind: authored
  license: CC-BY-4.0
  sources: []
  rationale: Project-authored smallest-group ownership. Coupled shoulder channels belong to arms despite
    their T1 parent; parent-following is not ownership transfer.
  changes: Original channel inventory; rest-policy semantics remain in diagnostic fixtures.
