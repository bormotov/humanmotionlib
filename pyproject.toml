[project]
name = "humanmotionlib"
version = "0.1.0"
description = "Data-driven anatomical skeleton and exercise animation diagnostics"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "Pillow>=11,<13"]

[tool.uv]
package = false

[tool.humanmotionlib.backend]
blender-version = "5.2.2 LTS"
blender-build = "d13f752e3b9c"
reference-platform = "Darwin-arm64"
mpfb = "not-used"
rigify = "not-used"
