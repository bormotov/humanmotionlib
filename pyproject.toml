[project]
name = "humanmotionlib"
version = "0.2.0"
description = "Data-driven anatomical skeleton and exercise animation diagnostics"
requires-python = ">=3.14,<3.15"
license-files = ["LICENSE-CODE", "LICENSE-DATA", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
    "Pillow>=11,<13",
    "referencing>=0.37,<1",
]

[project.scripts]
hml = "humanmotionlib.cli:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "hml_build_backend"
backend-path = ["."]

[dependency-groups]
build = ["setuptools==83.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanmotionlib = ["resources/**/*"]

[tool.humanmotionlib.backend]
blender-version = "5.2.2 LTS"
blender-build = "d13f752e3b9c"
reference-platform = "Darwin-arm64"
mpfb = "not-used"
rigify = "not-used"
